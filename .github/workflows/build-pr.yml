name: Build Pull Request

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'angular.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'projects/**'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Library
        run: pnpm ng build forge-angular-form-fields

      - name: Run Tests
        run: pnpm ng test forge-angular-form-fields
